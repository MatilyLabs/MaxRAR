name: Prepare signed updates (manual, no publishing)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x86_64
            rust_target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-15-intel
            target: darwin-x86_64
            rust_target: x86_64-apple-darwin
            bundles: app
          - os: macos-15
            target: darwin-aarch64
            rust_target: aarch64-apple-darwin
            bundles: app
          - os: ubuntu-24.04
            target: linux-x86_64
            rust_target: x86_64-unknown-linux-gnu
            bundles: appimage
    runs-on: ${{ matrix.os }}
    env:
      MAXRAR_UPDATER_PUBLIC_KEY: ${{ vars.MAXRAR_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.rust_target }}
      - name: Require release signing configuration
        shell: bash
        run: |
          test -n "$MAXRAR_UPDATER_PUBLIC_KEY" || { echo "Configure the public verification key first."; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "Configure the private signing secret first."; exit 1; }
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev
      - run: npm ci
      - run: npm run check
      - name: Build signed updater artifacts
        run: npm run tauri -- build --config src-tauri/tauri.updater.conf.json --bundles ${{ matrix.bundles }} --target ${{ matrix.rust_target }}
      - name: Stage assets and platform manifest
        shell: bash
        run: |
          release_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          python scripts/stage-update.py --root target/${{ matrix.rust_target }}/release/bundle --platform '${{ matrix.target }}' --version "$release_version"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maxrar-signed-${{ matrix.target }}
          path: release-stage/
          if-no-files-found: error
