name: Release packages and signed updates (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maxrar-release-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  stage:
    name: Signed release (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x86_64
            rust_target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-15-intel
            target: darwin-x86_64
            rust_target: x86_64-apple-darwin
            bundles: app,dmg
          - os: macos-15
            target: darwin-aarch64
            rust_target: aarch64-apple-darwin
            bundles: app,dmg
          - os: ubuntu-24.04
            target: linux-x86_64
            rust_target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Require complete updater configuration
        run: python scripts/check-release-config.py --require-secrets
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.rust_target }}
          components: rustfmt, clippy
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libfuse2
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: python -m unittest discover -s verification -p 'test_release*.py'
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Free checked debug artifacts before packaging
        run: cargo clean --profile dev
      - name: Build signed updater artifacts and initial installers
        run: npm run tauri -- build --config src-tauri/tauri.updater.conf.json --bundles ${{ matrix.bundles }} --target ${{ matrix.rust_target }}
      - name: Check Windows Explorer integration
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-shell.ps1 -BundleRoot 'target/${{ matrix.rust_target }}/release/bundle'
      - name: Stage assets and platform manifest
        shell: bash
        run: |
          release_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          python scripts/stage-update.py --root target/${{ matrix.rust_target }}/release/bundle --platform '${{ matrix.target }}' --version "$release_version"
          cp LICENSE NOTICE THIRD-PARTY-NOTICES.md release-stage/
      - name: Verify signed packages and reject tampered content
        run: cargo run --locked --release -p wonrar-desktop --example verify-updates --target ${{ matrix.rust_target }} -- release-stage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maxrar-signed-${{ matrix.target }}
          path: release-stage/
          if-no-files-found: error
  assemble:
    name: Complete feed and draft release
    needs: stage
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: maxrar-signed-*
          path: signed-platforms
      - name: Assemble complete release
        run: |
          release_version=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          python3 scripts/check-release-config.py
          python3 scripts/assemble-release.py --source signed-platforms --output release-stage --notes "docs/releases/v${release_version}.md"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maxrar-complete-release
          path: release-stage/
          if-no-files-found: error
      - name: Create reviewable draft with all packages and update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_version=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          gh release create "v${release_version}" release-stage/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "MaxRAR v${release_version}" --notes-file "docs/releases/v${release_version}.md" --draft
