name: Release packages and signed updates (manual)
run-name: ${{ inputs.source_run_id && format('Assemble existing signed packages (run {0})', inputs.source_run_id) || 'Build signed release packages' }}
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Existing run with four verified platform builds (assembly only; leave empty for new builds)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: maxrar-release-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  prepare:
    name: Check version tag and prepared draft
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    outputs:
      run_id: ${{ steps.source.outputs.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Require the version tag at this exact commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          python3 scripts/check-release-config.py
          python3 scripts/check-release-tag.py --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --source-run "$SOURCE_RUN_ID" --current-run "$GITHUB_RUN_ID" --output "$GITHUB_OUTPUT"
  stage:
    if: ${{ inputs.source_run_id == '' }}
    name: Signed release - ${{ matrix.label }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (x64)
            artifact: windows-x64
            target: windows-x86_64
            rust_target: x86_64-pc-windows-msvc
            bundles: nsis
            extra_config: --config src-tauri/tauri.explorer-menu.json --config src-tauri/release-signing.json
          - os: macos-15-intel
            label: macOS - Intel (x64)
            artifact: macos-intel
            target: darwin-x86_64
            rust_target: x86_64-apple-darwin
            bundles: app,dmg
          - os: macos-15
            label: macOS - Apple Silicon (M-series)
            artifact: macos-apple-silicon
            target: darwin-aarch64
            rust_target: aarch64-apple-darwin
            bundles: app,dmg
          - os: ubuntu-24.04
            label: Linux (x64)
            artifact: linux-x64
            target: linux-x86_64
            rust_target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Require complete updater configuration
        run: python scripts/check-release-config.py --require-secrets
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.rust_target }}
          components: rustfmt, clippy
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libfuse2
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: python -m unittest discover -s verification -p 'test_release*.py'
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Free checked debug artifacts before packaging
        run: cargo clean --profile dev
      - name: Install the Windows signing tool
        if: runner.os == 'Windows'
        run: cargo install trusted-signing-cli --locked
      - name: Build and sign the Windows 11 Explorer menu package
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: ./scripts/build-explorer-menu.ps1 -Target ${{ matrix.rust_target }} -Sign
      - name: Apple signing and notarization
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::error::Apple signing secrets are missing; refusing to publish an unsigned Mac release."
            exit 1
          fi
          cert=$(printf '%s' "$APPLE_CERTIFICATE" | tr -d ' \r\n')
          echo "::add-mask::$cert"
          echo "APPLE_CERTIFICATE=$cert" >> "$GITHUB_ENV"
          for v in APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            printf '%s=%s\n' "$v" "$(printf '%s' "${!v}" | tr -d '\r\n')" >> "$GITHUB_ENV"
          done
      - name: Build signed updater artifacts and initial installers
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: npm run tauri -- build --config src-tauri/tauri.updater.conf.json ${{ matrix.extra_config }} --bundles ${{ matrix.bundles }} --target ${{ matrix.rust_target }}
      - name: Check Windows publisher signatures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem 'target/${{ matrix.rust_target }}/release/bundle/nsis/*.exe').FullName
          if (@($setup).Count -ne 1) { throw "Expected one NSIS installer; found $(@($setup).Count)" }
          # Check the files users actually install: unpack the installer and verify what is inside.
          $unpacked = Join-Path $env:RUNNER_TEMP 'signed-installer'
          & "$env:ProgramFiles\7-Zip\7z.exe" x -y "-o$unpacked" $setup | Out-Null
          if ($LASTEXITCODE) { throw "Could not unpack $setup" }
          $inside = foreach ($name in 'maxrar.exe', 'maxrar_shell.dll') {
            $found = @(Get-ChildItem $unpacked -Recurse -File -Filter $name)
            if ($found.Count -eq 0) { throw "$name is missing from the installer" }
            $found.FullName
          }
          foreach ($f in @($setup) + $inside + 'target/explorer-menu/maxrar_shell.dll' + 'target/explorer-menu/maxrar-explorer-menu.msix') {
            $sig = Get-AuthenticodeSignature -LiteralPath $f
            if ($sig.Status -ne 'Valid') { throw "$f signature: $($sig.Status)" }
            Write-Output "$([IO.Path]::GetFileName($f)): $($sig.SignerCertificate.Subject)"
          }
      - name: Check Mac signature and notarization
        if: runner.os == 'macOS'
        run: |
          app=$(find target/${{ matrix.rust_target }}/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
      - name: Check Windows Explorer integration
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-shell.ps1 -BundleRoot 'target/${{ matrix.rust_target }}/release/bundle'
      - name: Stage assets and platform manifest
        shell: bash
        run: |
          release_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          python scripts/stage-update.py --root target/${{ matrix.rust_target }}/release/bundle --platform '${{ matrix.target }}' --version "$release_version"
          cp LICENSE NOTICE THIRD-PARTY-NOTICES.md release-stage/
      - name: Verify signed packages and reject tampered content
        run: cargo run --locked --release -p wonrar-desktop --example verify-updates --target ${{ matrix.rust_target }} -- release-stage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maxrar-signed-${{ matrix.artifact }}
          path: release-stage/
          if-no-files-found: error
  assemble:
    name: Complete feed and upload to draft
    needs: [prepare, stage]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.stage.result == 'success' || (needs.stage.result == 'skipped' && inputs.source_run_id != '')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: maxrar-signed-*
          path: signed-platforms
          run-id: ${{ needs.prepare.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Assemble complete release
        run: |
          release_version=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          python3 scripts/check-release-config.py
          python3 scripts/assemble-release.py --source signed-platforms --output release-stage --notes "docs/releases/v${release_version}.md"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maxrar-complete-release
          path: release-stage/
          if-no-files-found: error
          overwrite: true
      - name: Attach verified packages to the prepared draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_version=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          existing=$(gh release view "v${release_version}" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          if [ "$existing" != true ]; then
            echo "The prepared draft is missing or already published; refusing to replace its assets."
            exit 1
          fi
          gh release upload "v${release_version}" release-stage/* --repo "$GITHUB_REPOSITORY" --clobber
