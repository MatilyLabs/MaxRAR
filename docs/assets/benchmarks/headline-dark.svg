<svg xmlns="http://www.w3.org/2000/svg" width="880" height="176" viewBox="0 0 880 176" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' role="img" aria-labelledby="t d"><title id="t">MRAR/2 benchmark headline</title><desc id="d">20% smaller than 7-Zip -mx9 (256 MiB of text); 38× faster to create (same text, vs 7-Zip -mx9); 5% smaller than the best other tool (4,096 small files); +6% larger than 7-Zip -mx9 (real node_modules)</desc><rect x="0.5" y="0.5" width="879" height="175" rx="12" fill="#1a1a19" stroke="rgba(255,255,255,0.10)"/><text x="24.0" y="34.0" font-size="15" font-weight="600" fill="#f0efec" text-anchor="start">MRAR/2 at a glance</text><text x="856.0" y="34.0" font-size="12" font-weight="400" fill="#898781" text-anchor="end">Median of 3 trials · i7-14700F · Windows 11</text><rect x="24.0" y="50" width="199.0" height="102" rx="10" fill="none" stroke="#2c2c2a"/><rect x="24.0" y="50" width="4" height="102" rx="2" fill="#0ca30c"/><text x="42.0" y="96.0" font-size="34" font-weight="650" fill="#f0efec" text-anchor="start">20%</text><text x="42.0" y="120.0" font-size="13" font-weight="500" fill="#c3c2b7" text-anchor="start">smaller than 7-Zip -mx9</text><text x="42.0" y="139.0" font-size="12" font-weight="400" fill="#898781" text-anchor="start">256 MiB of text</text><rect x="235.0" y="50" width="199.0" height="102" rx="10" fill="none" stroke="#2c2c2a"/><rect x="235.0" y="50" width="4" height="102" rx="2" fill="#0ca30c"/><text x="253.0" y="96.0" font-size="34" font-weight="650" fill="#f0efec" text-anchor="start">38×</text><text x="253.0" y="120.0" font-size="13" font-weight="500" fill="#c3c2b7" text-anchor="start">faster to create</text><text x="253.0" y="139.0" font-size="12" font-weight="400" fill="#898781" text-anchor="start">same text, vs 7-Zip -mx9</text><rect x="446.0" y="50" width="199.0" height="102" rx="10" fill="none" stroke="#2c2c2a"/><rect x="446.0" y="50" width="4" height="102" rx="2" fill="#0ca30c"/><text x="464.0" y="96.0" font-size="